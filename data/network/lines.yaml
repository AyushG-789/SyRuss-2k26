# Transit lines for the TravelBuddy Mumbai prototype. See SPEC.md §2 and §5.
#
# STATUS: STARTER DATA. Station order is from public line maps; run_minutes and headways are
# APPROXIMATE and marked verify: true. P1: check against WR/CR timetables and the metro
# operators' sites, then set verify: false. Every stop id must exist in stations.yaml
# (python scripts/validate_data.py checks this).
#
# run_minutes[i] = minutes from stations[i] to stations[i+1] (one direction; reverse is the same).
# headway_min: minutes between trains per direction, by time band "HH:MM-HH:MM".

lines:
  - id: WR_SLOW
    name: Western Line (Slow)
    operator: Western Railway
    mode: local
    color: "#D32F2F"
    verify: true
    stations: [churchgate, marine_lines, charni_road, grant_road, mumbai_central, mahalaxmi,
               lower_parel, prabhadevi, dadar_wr, matunga_road, mahim, bandra, khar_road,
               santacruz, vile_parle, andheri_wr, jogeshwari, ram_mandir, goregaon, malad,
               kandivali, borivali]
    run_minutes: [3, 2, 2, 3, 2, 2, 2, 2, 2, 2, 3, 2, 3, 3, 3, 2, 2, 2, 3, 3, 3]
    headway_min: {"04:00-07:00": 8, "07:00-11:00": 4, "11:00-17:00": 7, "17:00-21:00": 4, "21:00-24:00": 9}

  - id: WR_FAST
    name: Western Line (Fast)
    operator: Western Railway
    mode: local
    color: "#B71C1C"
    verify: true
    stations: [churchgate, mumbai_central, dadar_wr, bandra, andheri_wr, borivali]
    run_minutes: [8, 8, 6, 9, 15]
    headway_min: {"04:00-07:00": 10, "07:00-11:00": 5, "11:00-17:00": 9, "17:00-21:00": 5, "21:00-24:00": 12}

  - id: CR_SLOW
    name: Central Line (Slow)
    operator: Central Railway
    mode: local
    color: "#F9A825"
    verify: true
    stations: [csmt, masjid, sandhurst_road, byculla, chinchpokli, currey_road, parel, dadar_cr,
               matunga, sion, kurla, vidyavihar, ghatkopar, vikhroli, kanjurmarg, bhandup, nahur,
               mulund, thane]
    run_minutes: [3, 2, 3, 2, 2, 2, 3, 3, 3, 4, 3, 3, 4, 3, 3, 3, 3, 5]
    headway_min: {"04:00-07:00": 8, "07:00-11:00": 4, "11:00-17:00": 7, "17:00-21:00": 4, "21:00-24:00": 9}

  - id: CR_FAST
    name: Central Line (Fast)
    operator: Central Railway
    mode: local
    color: "#F57F17"
    verify: true   # fast stopping pattern varies by train; this is the common one
    stations: [csmt, byculla, dadar_cr, kurla, ghatkopar, vikhroli, bhandup, mulund, thane]
    run_minutes: [7, 6, 7, 5, 5, 4, 5, 6]
    headway_min: {"04:00-07:00": 10, "07:00-11:00": 5, "11:00-17:00": 9, "17:00-21:00": 5, "21:00-24:00": 12}

  - id: HARBOUR
    name: Harbour Line (CSMT–Vashi)
    operator: Central Railway
    mode: local
    color: "#6A1B9A"
    verify: true
    stations: [csmt, masjid, sandhurst_road, dockyard_road, reay_road, cotton_green, sewri,
               vadala_road, gtb_nagar, chunabhatti, kurla_hb, tilak_nagar, chembur, govandi,
               mankhurd, vashi]
    run_minutes: [2, 2, 3, 2, 2, 2, 3, 3, 3, 3, 4, 3, 3, 3, 6]
    headway_min: {"04:00-07:00": 10, "07:00-11:00": 6, "11:00-17:00": 10, "17:00-21:00": 6, "21:00-24:00": 12}

  - id: METRO1
    name: Metro Line 1 (Versova–Ghatkopar)
    operator: Mumbai Metro One
    mode: metro
    color: "#1E88E5"
    verify: true
    stations: [versova, dn_nagar, azad_nagar, andheri_m1, weh_m1, chakala, airport_road,
               marol_naka_m1, saki_naka, asalpha, jagruti_nagar, ghatkopar_m1]
    run_minutes: [2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2]
    headway_min: {"05:30-08:00": 7, "08:00-11:00": 4, "11:00-17:00": 6, "17:00-21:00": 4, "21:00-24:00": 8}

  - id: METRO3
    name: Metro Line 3 (Aqua, Cuffe Parade–Aarey JVLR)
    operator: MMRCL
    mode: metro
    color: "#00ACC1"
    verify: true   # check that every station below is open on the demo date
    stations: [cuffe_parade, vidhan_bhavan, churchgate_m3, hutatma_chowk, csmt_m3, kalbadevi,
