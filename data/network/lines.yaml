# Walking links between separate stops of one station complex, or between a rail stop and its
# bus stop. walk_min is platform-to-platform. step_free: can a wheelchair user make this change?
# These ids are what events reference in affected.transfer_ids (e.g. a closed foot-overbridge).
transfers:
  - {id: T_dadar_cr__dadar_wr, a: dadar_cr, b: dadar_wr, walk_min: 6, step_free: false, via: "Dadar foot-overbridge (FOB)"}
  - {id: T_dadar_wr__dadar_m3, a: dadar_wr, b: dadar_m3, walk_min: 7, step_free: false}
  - {id: T_dadar_cr__dadar_m3, a: dadar_cr, b: dadar_m3, walk_min: 8, step_free: false}
  - {id: T_andheri_wr__andheri_m1, a: andheri_wr, b: andheri_m1, walk_min: 7, step_free: false}
  - {id: T_ghatkopar__ghatkopar_m1, a: ghatkopar, b: ghatkopar_m1, walk_min: 6, step_free: false}
  - {id: T_kurla__kurla_hb, a: kurla, b: kurla_hb, walk_min: 5, step_free: false}
  - {id: T_csmt__csmt_m3, a: csmt, b: csmt_m3, walk_min: 6, step_free: true}
  - {id: T_churchgate__churchgate_m3, a: churchgate, b: churchgate_m3, walk_min: 5, step_free: true}
  - {id: T_mumbai_central__mumbai_central_m3, a: mumbai_central, b: mumbai_central_m3, walk_min: 6, step_free: false}
  - {id: T_grant_road__grant_road_m3, a: grant_road, b: grant_road_m3, walk_min: 5, step_free: false}
  - {id: T_mahalaxmi__mahalaxmi_m3, a: mahalaxmi, b: mahalaxmi_m3, walk_min: 6, step_free: false}
  - {id: T_marol_naka_m1__marol_naka_m3, a: marol_naka_m1, b: marol_naka_m3, walk_min: 5, step_free: true}
